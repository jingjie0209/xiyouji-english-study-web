<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英文学习整理</title>
  <meta name="description" content="按每集整理英文台词、音标、中文、语法句型与固定搭配。" />
  <link rel="stylesheet" href="styles.css?v=planpicker-1" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow" id="seriesEyebrow">ENGLISH STUDY LIBRARY</p>
        <h1 id="siteTitle">西游记 108 集英文学习整理</h1>
        <p class="subtitle" id="siteSubtitle">按每集整理英文台词、音标、中文、语法句型与固定搭配</p>
        <div class="series-switch" id="seriesSwitch" aria-label="学习内容切换"></div>
        <div class="plan-entry" id="planEntry" hidden></div>
      </div>
    </div>
  </header>

  <main class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="section-label" id="catalogLabel">全书目录</div>
        <div class="count-badge" id="countBadge">108 集</div>
      </div>
      <label class="search-box">
        <span>⌕</span>
        <input id="searchInput" placeholder="搜索集数、标题或英文" autocomplete="off" />
      </label>
      <div class="filters" id="rangeFilters"></div>
      <nav class="episode-list" id="episodeList" aria-label="集数目录"></nav>
    </aside>

    <section class="content" id="content">
      <div class="loading" id="loading">正在加载学习内容……</div>
      <div id="episodeView" hidden>
        <div class="episode-hero">
          <div>
            <div class="episode-kicker" id="episodeKicker"></div>
            <h2 id="episodeTitle"></h2>
            <p class="episode-en-title" id="episodeEnTitle"></p>
          </div>
          <div class="episode-nav">
            <button class="icon-btn" id="prevBtn" aria-label="上一集">←</button>
            <button class="icon-btn" id="nextBtn" aria-label="下一集">→</button>
          </div>
        </div>
        <div class="stats" id="stats"></div>
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="dialogue" role="tab">台词整理</button>
          <button class="tab" data-tab="grammar" role="tab">语法句型</button>
          <button class="tab" data-tab="collocations" role="tab">固定搭配</button>
        </div>
        <div class="tab-panel" id="dialoguePanel"></div>
        <div class="tab-panel" id="grammarPanel" hidden></div>
        <div class="tab-panel" id="collocationsPanel" hidden></div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="siteFooter"></footer>
  <script src="data/episodes.js"></script>
  <script src="data/big-green-forest.js"></script>
  <script src="data/peppa.js"></script>
  <script src="data/peppa-plan.js?v=footerui-2"></script>
  <script src="app.js?v=final-filter-6"></script>
</body>
</html>
